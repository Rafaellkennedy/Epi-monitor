services:
  db:
    image: postgres:15-alpine
    container_name: epi_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-epi_monitor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-epi_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epi_monitor_app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-epi_monitor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DISPLAY: ${DISPLAY:-:0}
      QT_QPA_PLATFORM: ${QT_QPA_PLATFORM:-offscreen}
    volumes:
      - ./epi_monitor/storage:/app/epi_monitor/storage
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

volumes:
  postgres_data:
